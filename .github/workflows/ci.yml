name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint runs but does not gate on warnings yet (~100 pre-existing).
      # Tighten to --max-warnings 0 after the cleanup pass. See README roadmap.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      # Build is intentionally NOT run in CI. `next build` statically generates pages
      # by fetching the live WordPress GraphQL API, which the host (SiteGround) guards
      # with bot protection — CI runners get served a CAPTCHA page instead of JSON.
      # CI verifies our code (lint, types, tests); build reachability is a deploy-time
      # concern handled by Vercel. See README "Continuous integration" for detail.
